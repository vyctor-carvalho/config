##### PREFIX #####

# Troca Ctrl+b por Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

##### TERMINAL #####

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

##### GERAL #####

set -g mouse on
set -g history-limit 50000

# Janelas começam em 1
set -g base-index 1
setw -g pane-base-index 1

# Renumera janelas automaticamente
set -g renumber-windows on

##### SPLITS #####

# Vertical (lado a lado)
bind | split-window -h

# Horizontal (cima/baixo)
bind - split-window -v

# Mantém diretório atual
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

##### NAVEGAÇÃO #####

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### REDIMENSIONAR #####

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

##### JANELAS #####

# Última janela
bind Tab last-window

# Navegar entre janelas
bind -n C-Left previous-window
bind -n C-Right next-window

# Alternativa estilo Vim
bind -n M-h previous-window
bind -n M-l next-window

##### MATRIX THEME #####

set -g status-position bottom
set -g status-style "bg=#000000"

set -g status-justify left

set -g status-left-length 60
set -g status-right-length 30

#
# esquerda
#

set -g status-left "#[fg=#00ff00,bold]#(whoami)@#H #[fg=#008800]| #[fg=#00ff88]#S "

#
# direita
#

set -g status-right "#[fg=#008800]%d/%m #[fg=#00ff00]%H:%M "

#
# janelas
#

setw -g window-status-separator " "

setw -g window-status-format "#[fg=#006600] #I:#W "

setw -g window-status-current-format "#[fg=#000000,bg=#00ff00,bold] #I:#W "

#
# bordas
#

set -g pane-border-style fg="#003300"

set -g pane-active-border-style fg="#00ff00"

#
# mensagens
#

set -g message-style bg="#00ff00",fg="#000000"

#
# comandos
#

set -g mode-style bg="#00aa00",fg="#000000"

#
# relógio
#

set -g clock-mode-colour green

# Usa o tamanho do cliente mais recentemente ativo
setw -g window-size latest
setw -g aggressive-resize off

# Bordas Matrix
set -g pane-border-style "fg=#003300"
set -g pane-active-border-style "fg=#00ff00"

# Mensagens Matrix
set -g message-style "bg=#00ff00,fg=#000000"
set -g mode-style "bg=#00aa00,fg=#000000"

##### RECARREGAR CONFIG #####

bind r source-file ~/.tmux.conf \; display-message "tmux.conf recarregado!"

##### CÓPIA #####

setw -g mode-keys vi

bind Enter copy-mode

##### STATUS BAR #####

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g status-position bottom
set -g status-justify left

set -g status-left-length 40
set -g status-right-length 100

set -g status-left "#[fg=#00ff00,bold]#H#[fg=#008800]/#[fg=#00ff88]#S "
set -g status-right "%H:%M | %d/%m/%Y"

# Painéis inativos
setw -g window-status-format "#[fg=#000000,bg=#00ffff] #I:#W "

# Painel ativo
setw -g window-status-current-format "#[fg=#000000,bg=#39ff14,bold] #I:#W "

##### VISUAL #####

set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=green

set -g message-style bg=green,fg=black
set -g status-style bg=default

##### TEMPO #####

set -sg escape-time 10

##### SINCRONIZAR PAINÉIS #####

bind y setw synchronize-panes

##### COPY MODE (Vim + Clipboard Wayland) #####

# Navegação estilo Vim
setw -g mode-keys vi

# Entrar no modo de cópia
bind Enter copy-mode

# Seleção com 'v'
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Copiar com 'y' para o clipboard do sistema
#bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip"

# Colar o buffer do tmux
bind p paste-buffer
